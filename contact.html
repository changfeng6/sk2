<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 | Lumina Spirits</title>
    <meta name="description" content="聯絡 Lumina Spirits 了解頂級烈酒相關資訊。">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <img src="assets/images/liquor_logo.png" alt="Lumina Spirits">
            <span>LUMINA</span>
        </a>
        <ul class="nav-links">
            <li><a href="wine.html">葡萄酒</a></li>
            <li><a href="champagne.html">香檳</a></li>
            <li><a href="vodka.html">伏特加</a></li>
            <li><a href="tequila.html">龍舌蘭</a></li>
            <li><a href="whiskey.html">威士忌</a></li>
            <li><a href="brandy.html">白蘭地</a></li>
            <li><a href="rum.html">朗姆酒</a></li>
            <li><a href="gin.html">金酒</a></li>
            <li><a href="accessories.html">配件</a></li>
            <li><a href="contact.html">聯絡我們</a></li>
        </ul>
        <div class="nav-icons">
            <div class="cart-icon">🛒<span class="cart-count">0</span></div>
        </div>
    </nav>

    <header class="page-header">
        <h1 class="animate-on-scroll">聯絡我們</h1>
        <p class="animate-on-scroll" style="color: var(--text-muted); margin-top: 1rem;">我們隨時準備為您解答關於奢華烈酒系列的任何疑問。</p>
    </header>

    <section class="container contact-container">
        <form class="contact-form animate-on-scroll">
            <div class="form-group">
                <label for="name">全名</label>
                <input type="text" id="name" required placeholder="王小明">
            </div>
            <div class="form-group">
                <label for="email">電子郵件</label>
                <input type="email" id="email" required placeholder="wang@example.com">
            </div>
            <div class="form-group">
                <label for="subject">主旨</label>
                <input type="text" id="subject" required placeholder="產品諮詢">
            </div>
            <div class="form-group">
                <label for="message">訊息內容</label>
                <textarea id="message" rows="6" required placeholder="我們能如何協助您？"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" onclick="event.preventDefault(); alert('訊息已成功發送！');">發送訊息</button>
        </form>
    </section>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Lumina Spirits. 保留所有權利。</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
