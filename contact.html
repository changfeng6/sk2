<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Lumina Spirits</title>
    <meta name="description" content="Get in touch with Lumina Spirits for premium liquor inquiries.">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <img src="assets/images/liquor_logo.png" alt="Lumina Spirits">
            <span>LUMINA</span>
        </a>
        <ul class="nav-links">
            <li><a href="wine.html">Wine</a></li>
            <li><a href="champagne.html">Champagne</a></li>
            <li><a href="vodka.html">Vodka</a></li>
            <li><a href="tequila.html">Tequila</a></li>
            <li><a href="whiskey.html">Whiskey</a></li>
            <li><a href="brandy.html">Brandy</a></li>
            <li><a href="rum.html">Rum</a></li>
            <li><a href="gin.html">Gin</a></li>
            <li><a href="accessories.html">Accessories</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="nav-icons">
            <div class="cart-icon">🛒<span class="cart-count">0</span></div>
        </div>
    </nav>

    <header class="page-header">
        <h1 class="animate-on-scroll">Contact Us</h1>
        <p class="animate-on-scroll" style="color: var(--text-muted); margin-top: 1rem;">We're here to assist you with any inquiries about our luxury spirits collection.</p>
    </header>

    <section class="container contact-container">
        <form class="contact-form animate-on-scroll">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" required placeholder="Product Inquiry">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="6" required placeholder="How can we help you?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" onclick="event.preventDefault(); alert('Message sent successfully!');">Send Message</button>
        </form>
    </section>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Lumina Spirits. All rights reserved.</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
